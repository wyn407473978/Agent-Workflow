<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作流对话台</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --paper: #f9f8f4;
      --rail: #efeee7;
      --ink: #202820;
      --muted: #5e675d;
      --rule: #d9dcd1;
      --green: #284d3b;
      --green-dark: #1e3e2e;
      --tint: #e9efe6;
      --white: #fffefa;
      --error: #8a442e;
      --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible, textarea:focus-visible, a:focus-visible, .transcript:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }
    [hidden] { display: none !important; }
    .app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .rail { background: var(--rail); border-bottom: 1px solid var(--rule); padding: 14px 16px 12px; }
    .rail-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
    .brand-mark { width: 32px; height: 32px; flex: none; border-radius: 9px; background: var(--green); position: relative; }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; background: #eef3e8; height: 2px; border-radius: 10px; }
    .brand-mark::before { width: 14px; left: 9px; top: 12px; }
    .brand-mark::after { width: 9px; left: 9px; top: 18px; }
    .brand strong, .brand small { display: block; }
    .brand strong { font-size: 14px; font-weight: 700; }
    .brand small { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .new-chat, .plain-button {
      border: 1px solid var(--rule); border-radius: 8px; background: var(--white); color: var(--ink);
      padding: 8px 11px; font-size: 13px; white-space: nowrap;
    }
    .new-chat:hover:enabled, .plain-button:hover:enabled { border-color: #9aa997; background: var(--tint); }
    .new-chat span { color: var(--green); margin-right: 4px; font-weight: 700; }
    .rail-section { margin-top: 12px; }
    .rail-label { color: var(--muted); font-size: 11px; font-weight: 650; margin: 0 0 5px; }
    .session-card { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .session-card code, .inspector code { font: 11px/1.5 var(--mono); overflow-wrap: anywhere; }
    .session-card code { min-width: 0; flex: 1; }
    .copy-button { font-size: 11px; padding: 4px 7px; flex: none; }
    .inspector { display: none; }
    .workspace { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .workspace-header {
      padding: 13px 17px; display: flex; gap: 8px; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--rule);
    }
    .workspace-header h1 { margin: 0; font-size: 16px; font-weight: 700; }
    .model {
      display: flex; align-items: center; gap: 7px; border: 1px solid var(--rule); border-radius: 30px;
      padding: 6px 9px; color: var(--green-dark); background: var(--white); font: 11px/1.4 var(--mono);
      max-width: 55%; overflow-wrap: anywhere;
    }
    .model-dot { width: 7px; height: 7px; flex: none; background: #4b7857; border-radius: 50%; }
    .model[data-configured="false"] { color: var(--error); }
    .model[data-configured="false"] .model-dot { background: #a45b3d; }
    .transcript { min-height: 0; overflow: auto; padding: 0 17px; }
    .welcome { width: min(100%, 690px); min-height: 100%; margin: auto; display: grid; align-content: center; padding: 23px 0 27px; }
    .node-mark { display: flex; align-items: center; width: fit-content; margin-bottom: 16px; }
    .node-mark span { display: inline-block; width: 11px; height: 11px; border: 1px solid #8ba18d; border-radius: 50%; }
    .node-mark i { width: 14px; height: 1px; background: #8ba18d; }
    .node-mark span:nth-of-type(2) { width: 22px; height: 22px; border: 5px solid var(--tint); background: var(--green); }
    .welcome h2 { font-size: clamp(25px, 4vw, 42px); letter-spacing: -.045em; line-height: 1.18; margin: 0 0 9px; }
    .welcome p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .suggestions { display: grid; gap: 8px; }
    .suggestion {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
      padding: 10px 12px; border: 1px solid var(--rule); border-radius: 9px; background: var(--white);
      font-size: 13px; line-height: 1.45; color: var(--ink);
    }
    .suggestion:hover:enabled { border-color: #91a58d; background: var(--tint); }
    .suggestion span { color: var(--green); flex: none; }
    .turns { width: min(100%, 740px); margin: auto; padding: 20px 0 18px; }
    .turn { display: grid; gap: 16px; }
    .turn + .turn { margin-top: 27px; padding-top: 23px; border-top: 1px solid var(--rule); }
    .speaker { color: var(--muted); font-size: 11px; font-weight: 650; margin: 0 0 6px; }
    .message-user { justify-self: end; max-width: min(90%, 600px); }
    .message-user .speaker { text-align: right; }
    .message-user .message-text { background: var(--tint); border: 1px solid #d9e3d5; border-radius: 13px 13px 3px 13px; padding: 9px 13px; }
    .message-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: 14px; line-height: 1.7; }
    .answer-empty { color: var(--muted); }
    .turn-error { margin-top: 9px; padding: 8px 10px; color: var(--error); border: 1px solid #efdbd1; border-radius: 8px; background: #f9f0eb; font-size: 12px; }
    .turn-error .plain-button { margin-left: 7px; padding: 3px 8px; font-size: 11px; }
    .composer-wrap { border-top: 1px solid var(--rule); padding: 11px 17px 12px; background: var(--paper); }
    .composer { width: min(100%, 740px); margin: auto; }
    .compose-box { background: var(--white); border: 1px solid #bfcabe; border-radius: 13px; padding: 8px; }
    .compose-box:focus-within { border-color: #708e73; }
    #message { padding: 5px 6px 4px; color: var(--ink); border: 0; width: 100%; background: transparent; display: block; min-height: 40px; max-height: 116px; resize: vertical; field-sizing: content; font-size: 14px; line-height: 1.55; }
    #message:focus { outline: none; }
    #message::placeholder { color: var(--muted); }
    .compose-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .send { border: 1px solid var(--green); border-radius: 8px; background: var(--green); color: white; padding: 7px 12px; min-width: 67px; font-size: 13px; font-weight: 660; }
    .send:hover:enabled { background: var(--green-dark); }
    .compose-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .keyboard { display: none; }
    @media (min-width: 720px) {
      .app { grid-template-rows: minmax(0, 1fr); grid-template-columns: 250px minmax(0, 1fr); }
      .rail { padding: 25px 19px; border-bottom: 0; border-right: 1px solid var(--rule); overflow-y: auto; }
      .rail-top { display: grid; gap: 24px; }
      .brand { gap: 11px; }
      .brand-mark { width: 37px; height: 37px; }
      .brand-mark::before { top: 14px; left: 11px; }
      .brand-mark::after { top: 20px; left: 11px; }
      .brand strong { font-size: 15px; }
      .new-chat { width: 100%; text-align: left; padding: 10px 11px; }
      .rail-section { margin-top: 24px; }
      .rail-label { margin-bottom: 8px; }
      .session-card { background: var(--white); border: 1px solid var(--rule); border-radius: 9px; padding: 8px; }
      .inspector { display: block; border-top: 1px solid var(--rule); padding-top: 19px; }
      .inspector dl { margin: 0; display: grid; gap: 12px; }
      .inspector dt { color: var(--muted); font-size: 11px; }
      .inspector dd { margin: 3px 0 0; }
      .workspace-header { padding: 18px 30px; }
      .workspace-header h1 { font-size: 18px; }
      .model { padding: 7px 11px; }
      .transcript { padding: 0 28px; }
      .welcome { align-content: center; padding-bottom: 55px; }
      .node-mark { margin-bottom: 20px; }
      .welcome p { font-size: 15px; margin-bottom: 25px; }
      .suggestions { display: flex; flex-wrap: wrap; gap: 10px; }
      .suggestion { gap: 15px; padding: 11px 13px; }
      .turns { padding: 32px 0 25px; }
      .message-text { font-size: 15px; }
      .composer-wrap { padding: 16px 28px 15px; }
      .compose-box { padding: 10px; }
      #message { min-height: 46px; font-size: 15px; }
      .keyboard { display: inline; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="会话工具">
      <div class="rail-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div><strong>Agent Workflow</strong><small>本地测试台</small></div>
        </div>
        <button class="new-chat" id="new-chat" type="button"><span aria-hidden="true">＋</span> 新建会话</button>
      </div>
      <section class="rail-section" aria-labelledby="session-label">
        <h2 class="rail-label" id="session-label">会话 ID</h2>
        <div class="session-card"><code id="session-id"></code><button class="plain-button copy-button" id="copy-session" type="button">复制</button></div>
      </section>
      <section class="rail-section inspector" aria-labelledby="run-label">
        <h2 class="rail-label" id="run-label">最近一轮</h2>
        <dl>
          <div><dt>工作流 ID</dt><dd><code id="workflow-id">—</code></dd></div>
          <div><dt>请求 ID</dt><dd><code id="request-id">—</code></dd></div>
          <div><dt>事件 ID</dt><dd><code id="event-id">—</code></dd></div>
          <div><dt>事件状态</dt><dd><code id="event-status">—</code></dd></div>
        </dl>
      </section>
    </aside>
    <main class="workspace">
      <header class="workspace-header">
        <h1>工作流对话</h1>
        <span class="model" id="model" data-configured="{{.Configured}}"><span class="model-dot" aria-hidden="true"></span>{{if .Configured}}{{.Model}}{{else}}模型未配置{{end}}</span>
      </header>
      <section class="transcript" id="transcript" aria-label="对话记录" tabindex="0">
        <div class="welcome" id="welcome">
          <div class="node-mark" aria-hidden="true"><span></span><i></i><span></span><i></i><span></span></div>
          <h2>开始一轮对话</h2>
          <p>发送消息，测试流式回复和跨轮记忆。</p>
          <div class="suggestions">
            <button class="suggestion" type="button" data-prompt="请记住我的测试代号是青松。"><b>记住我的代号</b><span aria-hidden="true">↗</span></button>
            <button class="suggestion" type="button" data-prompt="我的测试代号是什么？"><b>检查会话记忆</b><span aria-hidden="true">↗</span></button>
            <button class="suggestion" type="button" data-prompt="用三句话介绍松树。"><b>试试流式回复</b><span aria-hidden="true">↗</span></button>
          </div>
        </div>
        <div class="turns" id="turns" hidden></div>
      </section>
      <div class="composer-wrap">
        <form class="composer" id="composer">
          <div class="compose-box">
            <textarea id="message" rows="1" maxlength="4000" aria-label="测试消息" placeholder="输入一条测试消息…"></textarea>
            <div class="compose-actions">
              <button class="plain-button" id="stop" type="button" hidden>停止</button>
              <button class="send" id="send" type="submit" disabled>发送 <span aria-hidden="true">↑</span></button>
            </div>
          </div>
          <div class="compose-meta"><span id="ui-status" role="status"></span><span class="keyboard">Enter 发送 · Shift + Enter 换行</span></div>
        </form>
      </div>
    </main>
  </div>
  <script>
    const find = (id) => document.getElementById(id);
    const composer = find('composer');
    const input = find('message');
    const transcript = find('transcript');
    const turns = find('turns');
    const configured = find('model').dataset.configured === 'true';
    const suggestions = document.querySelectorAll('[data-prompt]');
    const storageKey = 'agent-workflow-browser-chat-v1';
    let active = null;
    let conversation = restoreConversation();

    function newConversation() {
      return { id: crypto.randomUUID(), turns: [] };
    }

    function restoreConversation() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved?.id && Array.isArray(saved.turns)) {
          for (const turn of saved.turns) {
            if (turn.state === 'streaming') {
              Object.assign(turn, { state: 'failed', error: '上一轮已中断。可以重试此请求。', retryable: true });
            }
          }
          return saved;
        }
      } catch (error) {
        // The page still works when local storage is unavailable.
      }
      return newConversation();
    }

    function saveConversation() {
      try { localStorage.setItem(storageKey, JSON.stringify(conversation)); } catch (error) { /* work in memory */ }
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function updateControls() {
      find('send').disabled = !configured || active !== null || !input.value.trim();
      find('stop').hidden = active === null;
      find('new-chat').disabled = active !== null;
      input.disabled = !configured;
      for (const button of suggestions) button.disabled = !configured || active !== null;
    }

    function render() {
      find('session-id').textContent = conversation.id;
      find('welcome').hidden = conversation.turns.length > 0;
      turns.hidden = conversation.turns.length === 0;
      turns.replaceChildren();
      let liveReply = null;
      for (const turn of conversation.turns) {
        const row = element('article', 'turn');
        const user = element('div', 'message-user');
        user.append(element('p', 'speaker', '你'), element('p', 'message-text', turn.message));
        const answer = element('div', 'message-assistant');
        const reply = element('p', 'message-text', turn.reply || (turn.state === 'streaming' ? '等待回复…' : ''));
        if (!turn.reply) reply.classList.add('answer-empty');
        answer.append(element('p', 'speaker', '工作流'), reply);
        if (turn.state === 'failed') {
          const failure = element('div', 'turn-error', turn.error);
          if (turn.retryable) {
            const retry = element('button', 'plain-button', '重试');
            retry.type = 'button';
            retry.disabled = !configured || active !== null;
            retry.addEventListener('click', () => submitTurn(turn));
            failure.append(retry);
          }
          answer.append(failure);
        }
        if (turn.state === 'streaming') liveReply = reply;
        row.append(user, answer);
        turns.append(row);
      }
      const latest = conversation.turns.at(-1);
      const knownWorkflow = conversation.turns.findLast(turn => turn.result?.workflow_id);
      find('workflow-id').textContent = knownWorkflow?.result.workflow_id || '—';
      find('request-id').textContent = latest?.id || '—';
      find('event-id').textContent = latest?.result?.event_id || '—';
      find('event-status').textContent = latest?.result?.event_status || (latest?.state === 'streaming' ? '处理中' : '—');
      find('ui-status').textContent = configured ? (active ? '正在接收回复…' : '可发送消息') : '请检查 DS_API_KEY 和 DS_BASE_URL 后重启服务';
      updateControls();
      return liveReply;
    }

    class ChatError extends Error {
      constructor(message, retryable, result) {
        super(message);
        this.retryable = retryable;
        this.result = result;
      }
    }

    async function readReply(response, onDelta) {
      if (!response.ok) {
        const event = await response.json().catch(() => null);
        throw new ChatError(event?.error?.message || `服务返回 ${response.status}。`, event?.error?.retryable ?? response.status >= 500, event?.result);
      }
      if (!response.body || !response.headers.get('Content-Type')?.startsWith('application/x-ndjson')) {
        throw new ChatError('服务未返回流式回复。', true);
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let pending = '';
      const handleLine = (line) => {
        if (!line.trim()) return null;
        const event = JSON.parse(line);
        if (event.type === 'delta' && typeof event.text === 'string') onDelta(event.text);
        if (event.type === 'error') throw new ChatError(event.error?.message || '本轮回复中断。', event.error?.retryable ?? true, event.result);
        if (event.type === 'done' && typeof event.result?.reply?.text === 'string') return event.result;
        return null;
      };
      try {
        while (true) {
          const { done, value } = await reader.read();
          pending += decoder.decode(value, { stream: !done });
          const lines = pending.split('\n');
          pending = lines.pop();
          for (const line of lines) {
            const result = handleLine(line);
            if (result) return result;
          }
          if (done) {
            const result = handleLine(pending);
            if (result) return result;
            throw new ChatError('连接在回复确认前关闭。可以重试本轮。', true);
          }
        }
      } finally {
        await reader.cancel().catch(() => {});
        reader.releaseLock();
      }
    }

    async function submitTurn(turn) {
      if (!configured || active) return;
      const controller = new AbortController();
      active = controller;
      Object.assign(turn, { state: 'streaming', reply: '', error: '', result: null });
      saveConversation();
      const liveReply = render();
      transcript.scrollTop = transcript.scrollHeight;
      try {
        const response = await fetch('/api/workflows/test/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/x-ndjson' },
          body: JSON.stringify({ session_id: conversation.id, request_id: turn.id, message: turn.message }),
          signal: controller.signal,
        });
        const result = await readReply(response, (delta) => {
          const follow = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 100;
          turn.reply += delta;
          liveReply.textContent = turn.reply;
          liveReply.classList.remove('answer-empty');
          if (follow) transcript.scrollTop = transcript.scrollHeight;
        });
        Object.assign(turn, { state: 'complete', reply: result.reply.text, result });
      } catch (error) {
        const stopped = controller.signal.aborted;
        Object.assign(turn, {
          state: 'failed',
          error: stopped ? '已停止接收。可以重试本轮。' : (error instanceof ChatError ? error.message : '连接中断。可以重试本轮。'),
          retryable: stopped || (error instanceof ChatError ? error.retryable : true),
          result: error.result || null,
        });
      } finally {
        const follow = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 100;
        active = null;
        saveConversation();
        render();
        if (follow) transcript.scrollTop = transcript.scrollHeight;
        find('ui-status').textContent = turn.state === 'complete' ? '回复已保存' : turn.error;
      }
    }

    composer.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!configured || active || !input.value.trim()) return;
      const turn = { id: crypto.randomUUID(), message: input.value.trim() };
      conversation.turns.push(turn);
      input.value = '';
      submitTurn(turn);
    });
    input.addEventListener('input', updateControls);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });
    for (const button of suggestions) {
      button.addEventListener('click', () => {
        input.value = button.dataset.prompt;
        input.focus();
        updateControls();
      });
    }
    find('stop').addEventListener('click', () => active?.abort());
    find('new-chat').addEventListener('click', () => {
      if (active) return;
      conversation = newConversation();
      input.value = '';
      saveConversation();
      render();
      if (configured) input.focus();
    });
    find('copy-session').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(conversation.id);
        find('ui-status').textContent = '已复制会话 ID';
      } catch (error) {
        find('ui-status').textContent = '复制不可用，可手动选中会话 ID';
      }
    });
    saveConversation();
    render();
    transcript.scrollTop = transcript.scrollHeight;
  </script>
</body>
</html>
